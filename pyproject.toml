[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dsgvo-checker"
version = "2.0.0"
description = "Automated DSGVO/GDPR Compliance Scanner & Audit Report Generator for Websites"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "DSF Commercial & Personal Source-Available License" }
authors = [
    { name = "AirFun1311", email = "sf.foodzeit@googlemail.com" },
]
keywords = [
    "dsgvo",
    "gdpr",
    "compliance",
    "security",
    "privacy",
    "scanner",
    "audit",
    "reportlab",
    "streamlit",
    "playwright"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Legal Industry",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "requests>=2.31.0",
    "reportlab>=4.0.0",
    "streamlit>=1.30.0",
    "playwright>=1.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "flake8>=7.0.0",
    "bandit>=1.7.8",
    "mypy>=1.9.0",
    "pip-audit>=2.7.0",
    "pre-commit>=3.6.0",
    "types-requests>=2.31.0",
]

[project.scripts]
dsgvo-scanner = "run_scan:main"
dsgvo-checker = "run_scan:main"

[project.urls]
Homepage = "https://github.com/AirFun1311/dsgvo-checker"
Documentation = "https://github.com/AirFun1311/dsgvo-checker#readme"
Repository = "https://github.com/AirFun1311/dsgvo-checker.git"
Issues = "https://github.com/AirFun1311/dsgvo-checker/issues"
Changelog = "https://github.com/AirFun1311/dsgvo-checker/blob/main/CHANGELOG.md"

[tool.setuptools]
py-modules = ["dsgvo_scanner", "report_pdf", "run_scan", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "setup.py",
    ".venv/*",
    "venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort imports
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line length handled by formatter
    "B008", # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["dsgvo_scanner", "report_pdf", "run_scan", "app"]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
