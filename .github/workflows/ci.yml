name: CI & Quality Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test & Quality (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint Code with Flake8
        run: |
          # Stop build if syntax errors or undefined names exist
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats warnings non-fatally
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics

      - name: Run Unit Tests with Pytest & Coverage
        run: |
          pytest tests/ --cov=. --cov-report=term-missing --cov-report=xml

  security:
    name: Security & Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Run Dependency Vulnerability Scan
        run: |
          pip-audit -r requirements.txt || true
